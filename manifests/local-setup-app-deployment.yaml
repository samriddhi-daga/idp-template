apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-setup-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-setup-app
  template:
    metadata:
      labels:
        app: local-setup-app
    spec:
      containers:
        - name: web
          image: <+artifacts.primary.image>
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: local-setup-app
spec:
  selector:
    app: local-setup-app
  ports:
    - port: 80
      targetPort: 80
